name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GalacticTravel.slnx

      - name: Build
        run: dotnet build GalacticTravel.slnx --configuration Release --no-restore
        
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test GalacticTravel.slnx --configuration Release --no-build
