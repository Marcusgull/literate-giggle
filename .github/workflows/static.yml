name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        

      - name: CI test
        run: echo "CI pipeline passed!"
