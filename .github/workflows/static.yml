name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GalacticTravel.slnx

      - name: Build
        run: dotnet build GalacticTravel.slnx --configuration Release --no-restore
        
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test GalacticTravel.slnx --configuration Release --no-build

  deploy:
    needs: test

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: production
      url: ${{  steps.deployment.outputs.page_url  }}

    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{  secrets.GITHUB_TOKEN  }}
          
      - name: use node.js
        uses: actions/configure-pages@v4
        with:
          node-version: '20.x'

      - name: configure github pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
          
      - run: npm install
      - run: npm run build
      
      - name: upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
          
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
